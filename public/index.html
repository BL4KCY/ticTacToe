<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - Multiplayer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #e94560;
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Connection Section */
    .connection-section {
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      color: #fff;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .input-group input:focus {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e94560, #c73e54);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Status */
    .status-bar {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }

    .status-text {
      color: #fff;
      font-size: 1.1rem;
    }

    .status-text.waiting { color: #ffd700; }
    .status-text.your-turn { color: #00ff88; }
    .status-text.opponent-turn { color: #ff9f43; }
    .status-text.winner { color: #00ff88; }
    .status-text.loser { color: #e94560; }
    .status-text.draw { color: #74b9ff; }

    .game-id {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 5px;
    }

    .game-id code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 5px;
      user-select: all;
    }

    /* Game Board */
    .board-container {
      display: none;
    }

    .board-container.active {
      display: block;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px auto;
      max-width: 320px;
    }

    .cell {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 15px;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cell:hover:not(.taken):not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .cell.X {
      color: #e94560;
      text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
    }

    .cell.O {
      color: #00d9ff;
      text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
    }

    .cell.taken {
      cursor: not-allowed;
    }

    .cell:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .cell.winning {
      animation: pulse 0.5s ease infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    /* Players Info */
    .players-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .player-card {
      flex: 1;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      text-align: center;
    }

    .player-card:first-child {
      margin-right: 10px;
    }

    .player-card.active {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
    }

    .player-card.you {
      border: 2px solid rgba(233, 69, 96, 0.5);
    }

    .player-symbol {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .player-symbol.X { color: #e94560; }
    .player-symbol.O { color: #00d9ff; }

    .player-name {
      color: #fff;
      font-size: 0.9rem;
    }

    .player-name.empty {
      color: rgba(255, 255, 255, 0.4);
      font-style: italic;
    }

    /* Waiting Games List */
    .waiting-games {
      margin-top: 20px;
    }

    .waiting-games h3 {
      color: #fff;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .games-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .game-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .game-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .game-item-info {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
    }

    .btn-join {
      padding: 6px 15px;
      font-size: 0.8rem;
    }

    .no-games {
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      padding: 20px;
      font-style: italic;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .toast {
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 15px 25px;
      border-radius: 10px;
      margin-bottom: 10px;
      animation: slideIn 0.3s ease;
      max-width: 300px;
    }

    .toast.error {
      border-left: 4px solid #e94560;
    }

    .toast.success {
      border-left: 4px solid #00ff88;
    }

    .toast.info {
      border-left: 4px solid #00d9ff;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Hidden */
    .hidden {
      display: none !important;
    }

    /* Connection Status Indicator */
    .connection-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .connection-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .connection-dot.connected {
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
    }

    .connection-dot.disconnected {
      background: #e94560;
      box-shadow: 0 0 10px #e94560;
    }

    .connection-status-text {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Tic Tac Toe</h1>
    
    <div class="card">
      <!-- Connection Status -->
      <div class="connection-indicator">
        <div class="connection-dot disconnected" id="connectionDot"></div>
        <span class="connection-status-text" id="connectionStatus">Disconnected</span>
      </div>

      <!-- Login/Join Section -->
      <div class="connection-section" id="connectionSection">
        <div class="input-group">
          <label for="playerName">Your Name</label>
          <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
        </div>
        
        <div class="input-group">
          <label for="gameIdInput">Game ID (optional - leave empty to create new)</label>
          <input type="text" id="gameIdInput" placeholder="Enter game ID to join">
        </div>

        <div class="btn-group">
          <button class="btn btn-primary" id="btnNewGame">Create Game</button>
          <button class="btn btn-secondary" id="btnJoinGame">Join Game</button>
        </div>

        <!-- Waiting Games -->
        <div class="waiting-games">
          <h3>🕐 Available Games</h3>
          <div class="games-list" id="gamesList">
            <div class="no-games">Loading games...</div>
          </div>
          <button class="btn btn-secondary" id="btnRefresh" style="width: 100%; margin-top: 10px;">
            🔄 Refresh
          </button>
        </div>
      </div>

      <!-- Game Section -->
      <div class="board-container" id="gameSection">
        <div class="status-bar">
          <div class="status-text" id="statusText">Connecting...</div>
          <div class="game-id" id="gameIdDisplay"></div>
        </div>

        <div class="players-info" id="playersInfo">
          <div class="player-card" id="playerX">
            <div class="player-symbol X">X</div>
            <div class="player-name empty" id="playerXName">Waiting...</div>
          </div>
          <div class="player-card" id="playerO">
            <div class="player-symbol O">O</div>
            <div class="player-name empty" id="playerOName">Waiting...</div>
          </div>
        </div>

        <div class="board" id="board">
          <button class="cell" data-row="0" data-col="0"></button>
          <button class="cell" data-row="0" data-col="1"></button>
          <button class="cell" data-row="0" data-col="2"></button>
          <button class="cell" data-row="1" data-col="0"></button>
          <button class="cell" data-row="1" data-col="1"></button>
          <button class="cell" data-row="1" data-col="2"></button>
          <button class="cell" data-row="2" data-col="0"></button>
          <button class="cell" data-row="2" data-col="1"></button>
          <button class="cell" data-row="2" data-col="2"></button>
        </div>

        <div class="btn-group">
          <button class="btn btn-secondary" id="btnLeave">Leave Game</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Configuration
    const WS_URL = 'ws://localhost:8080';
    const API_URL = 'http://localhost:3000';

    // State
    let ws = null;
    let gameState = null;
    let myPlayerId = null;
    let mySymbol = null;

    // DOM Elements
    const connectionDot = document.getElementById('connectionDot');
    const connectionStatus = document.getElementById('connectionStatus');
    const connectionSection = document.getElementById('connectionSection');
    const gameSection = document.getElementById('gameSection');
    const playerNameInput = document.getElementById('playerName');
    const gameIdInput = document.getElementById('gameIdInput');
    const btnNewGame = document.getElementById('btnNewGame');
    const btnJoinGame = document.getElementById('btnJoinGame');
    const btnRefresh = document.getElementById('btnRefresh');
    const btnLeave = document.getElementById('btnLeave');
    const gamesList = document.getElementById('gamesList');
    const statusText = document.getElementById('statusText');
    const gameIdDisplay = document.getElementById('gameIdDisplay');
    const board = document.getElementById('board');
    const cells = document.querySelectorAll('.cell');
    const playerXName = document.getElementById('playerXName');
    const playerOName = document.getElementById('playerOName');
    const playerXCard = document.getElementById('playerX');
    const playerOCard = document.getElementById('playerO');

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadWaitingGames();
      setupEventListeners();
    });

    function setupEventListeners() {
      btnNewGame.addEventListener('click', () => createOrJoinGame(null));
      btnJoinGame.addEventListener('click', () => {
        const gameId = gameIdInput.value.trim();
        if (gameId) {
          createOrJoinGame(gameId);
        } else {
          showToast('Please enter a game ID', 'error');
        }
      });
      btnRefresh.addEventListener('click', loadWaitingGames);
      btnLeave.addEventListener('click', leaveGame);

      cells.forEach(cell => {
        cell.addEventListener('click', () => {
          const row = parseInt(cell.dataset.row);
          const col = parseInt(cell.dataset.col);
          makeMove(row, col);
        });
      });

      // Enter key to join
      playerNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') createOrJoinGame(null);
      });
      gameIdInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const gameId = gameIdInput.value.trim();
          createOrJoinGame(gameId || null);
        }
      });
    }

    // WebSocket Connection
    function connectWebSocket() {
      return new Promise((resolve, reject) => {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          console.log('WebSocket connected');
          updateConnectionStatus(true);
          resolve();
        };

        ws.onclose = () => {
          console.log('WebSocket disconnected');
          updateConnectionStatus(false);
          if (gameState) {
            showToast('Connection lost', 'error');
            leaveGame();
          }
        };

        ws.onerror = (error) => {
          console.error('WebSocket error:', error);
          reject(error);
        };

        ws.onmessage = (event) => {
          const message = JSON.parse(event.data);
          handleMessage(message);
        };
      });
    }

    function updateConnectionStatus(connected) {
      connectionDot.className = `connection-dot ${connected ? 'connected' : 'disconnected'}`;
      connectionStatus.textContent = connected ? 'Connected' : 'Disconnected';
    }

    // Message Handlers
    function handleMessage(message) {
      console.log('Received:', message);

      switch (message.type) {
        case 'game_update':
          handleGameUpdate(message.payload);
          break;
        case 'game_over':
          handleGameOver(message.payload);
          break;
        case 'error':
          showToast(message.payload.error, 'error');
          break;
        case 'player_left':
          showToast('Opponent left the game', 'info');
          updateStatus('Opponent left', 'waiting');
          break;
      }
    }

    function handleGameUpdate(game) {
      gameState = game;
      
      // Determine my symbol based on player ID
      if (game.players[0]?.id === myPlayerId) {
        mySymbol = 'X';
      } else if (game.players[1]?.id === myPlayerId) {
        mySymbol = 'O';
      }

      updateBoard(game.board);
      updatePlayersInfo(game.players);
      updateGameStatus(game);
      
      gameIdDisplay.innerHTML = `Game ID: <code>${game.id}</code>`;
    }

    function handleGameOver(result) {
      const { winner } = result;
      
      if (result.result === 'draw') {
        updateStatus("It's a Draw! 🤝", 'draw');
      } else if (winner === mySymbol) {
        updateStatus('You Won! 🎉', 'winner');
      } else {
        updateStatus('You Lost 😢', 'loser');
      }

      // Disable all cells
      cells.forEach(cell => cell.disabled = true);
    }

    // Game Actions
    async function createOrJoinGame(gameId) {
      const playerName = playerNameInput.value.trim() || 'Player';

      try {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          await connectWebSocket();
        }

        const message = {
          type: 'join_game',
          payload: {
            gameId: gameId,
            playerName: playerName
          }
        };

        ws.send(JSON.stringify(message));
        
        // Show game section
        connectionSection.classList.add('hidden');
        gameSection.classList.add('active');
        
        updateStatus('Connecting to game...', '');
        
      } catch (error) {
        showToast('Failed to connect to server', 'error');
      }
    }

    function makeMove(row, col) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        showToast('Not connected', 'error');
        return;
      }

      if (!gameState || gameState.status !== 'in_progress') {
        return;
      }

      if (gameState.currentTurn !== mySymbol) {
        showToast("It's not your turn!", 'error');
        return;
      }

      const message = {
        type: 'make_move',
        payload: { row, col }
      };

      ws.send(JSON.stringify(message));
    }

    function leaveGame() {
      if (ws) {
        ws.close();
        ws = null;
      }
      
      gameState = null;
      myPlayerId = null;
      mySymbol = null;
      
      // Reset UI
      connectionSection.classList.remove('hidden');
      gameSection.classList.remove('active');
      
      cells.forEach(cell => {
        cell.textContent = '';
        cell.className = 'cell';
        cell.disabled = false;
      });
      
      playerXCard.classList.remove('active', 'you');
      playerOCard.classList.remove('active', 'you');
      
      loadWaitingGames();
    }

    // UI Updates
    function updateBoard(boardState) {
      cells.forEach(cell => {
        const row = parseInt(cell.dataset.row);
        const col = parseInt(cell.dataset.col);
        const value = boardState[row][col];
        
        cell.textContent = value || '';
        cell.className = `cell ${value ? value + ' taken' : ''}`;
        
        // Disable cell if taken or game not in progress
        cell.disabled = !!value || gameState?.status !== 'in_progress' || gameState?.currentTurn !== mySymbol;
      });
    }

    function updatePlayersInfo(players) {
      // Player X
      if (players[0]) {
        playerXName.textContent = players[0].name;
        playerXName.classList.remove('empty');
        
        if (players[0].id === myPlayerId) {
          playerXCard.classList.add('you');
          myPlayerId = players[0].id;
        }
      } else {
        playerXName.textContent = 'Waiting...';
        playerXName.classList.add('empty');
      }

      // Player O
      if (players[1]) {
        playerOName.textContent = players[1].name;
        playerOName.classList.remove('empty');
        
        if (players[1].id === myPlayerId) {
          playerOCard.classList.add('you');
          myPlayerId = players[1].id;
        }
      } else {
        playerOName.textContent = 'Waiting...';
        playerOName.classList.add('empty');
      }

      // Highlight current player
      playerXCard.classList.toggle('active', gameState?.currentTurn === 'X');
      playerOCard.classList.toggle('active', gameState?.currentTurn === 'O');
    }

    function updateGameStatus(game) {
      if (game.status === 'waiting') {
        updateStatus('Waiting for opponent...', 'waiting');
      } else if (game.status === 'in_progress') {
        if (game.currentTurn === mySymbol) {
          updateStatus('Your turn!', 'your-turn');
        } else {
          updateStatus("Opponent's turn", 'opponent-turn');
        }
      } else if (game.status === 'finished') {
        // handled by game_over message
      }
    }

    function updateStatus(text, className) {
      statusText.textContent = text;
      statusText.className = `status-text ${className}`;
    }

    // API Calls
    async function loadWaitingGames() {
      try {
        const response = await fetch(`${API_URL}/api/games/waiting`);
        const data = await response.json();
        
        renderWaitingGames(data.games || []);
      } catch (error) {
        console.error('Failed to load waiting games:', error);
        gamesList.innerHTML = '<div class="no-games">Failed to load games</div>';
      }
    }

    function renderWaitingGames(games) {
      if (games.length === 0) {
        gamesList.innerHTML = '<div class="no-games">No games available. Create one!</div>';
        return;
      }

      gamesList.innerHTML = games.map(game => {
        const hostName = game.players[0]?.name || 'Unknown';
        return `
          <div class="game-item">
            <div class="game-item-info">
              <strong>${hostName}'s game</strong><br>
              <small>${game.id.substring(0, 8)}...</small>
            </div>
            <button class="btn btn-primary btn-join" onclick="joinGame('${game.id}')">
              Join
            </button>
          </div>
        `;
      }).join('');
    }

    function joinGame(gameId) {
      gameIdInput.value = gameId;
      createOrJoinGame(gameId);
    }

    // Toast Notifications
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      
      document.getElementById('toastContainer').appendChild(toast);
      
      setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Fix: Set myPlayerId from first game update
    const originalHandleGameUpdate = handleGameUpdate;
    handleGameUpdate = function(game) {
      // First time receiving game state, determine our player ID
      if (!myPlayerId) {
        // We're the most recently connected player
        // If only player 0 exists, we're player 0
        // If both exist, we're player 1 (just joined)
        if (game.players[1]) {
          myPlayerId = game.players[1].id;
        } else if (game.players[0]) {
          myPlayerId = game.players[0].id;
        }
      }
      originalHandleGameUpdate(game);
    };
  </script>
</body>
</html>
